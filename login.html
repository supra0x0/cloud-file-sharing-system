<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SFS</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">
            <span>SFS</span>
            <p>Secure File Sharing</p>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#features">Features</a>
            <a href="index.html#about">About</a>
        </nav>

    </header>


    <!-- Login Section -->
    <main class="auth-container">

        <div class="auth-card">

            <!-- Heading -->
            <div class="auth-header">

                <div class="auth-icon">
                    🔐
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to your SFS account
                </p>

            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="show-password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Remember / Forgot -->
                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>

                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>


                <!-- Error / Success Message -->
                <p
                    id="loginMessage"
                    class="form-message"
                ></p>

            </form>


            <!-- Register Link -->
            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create Account
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <div class="footer-logo">
            <strong>SFS</strong>
            <span>Secure File Sharing</span>
        </div>

        <p>
            © 2026 SFS. Cloud-Based Secure File Sharing System.
        </p>

    </footer>


    <!-- Login JavaScript -->
    <script type="module" src="./js/auth.js"></script>

</body>
</html>
