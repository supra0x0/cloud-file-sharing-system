<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - SFS</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logoo">
            <span><img src="6d5656d0329ecddce92189ee7727ef29.jpg"></span>
            <p>Secure File Sharing</p>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#features">Features</a>
            <a href="index.html#about">About</a>
            <a href="login.html" class="login-btn">Login</a>
        </nav>

    </header>


    <!-- Registration Section -->
    <main class="auth-container">

        <div class="auth-card">

            <!-- Heading -->
            <div class="auth-header">

                <div class="auth-icon">
                    👤
                </div>

                <h1>Create Account</h1>

                <p>
                    Join SFS and start sharing files securely
                </p>

            </div>


            <!-- Registration Form -->
            <form id="registerForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="show-password"
                        >
                            Show
                        </button>

                    </div>

                    <small>
                        Password must contain at least 6 characters.
                    </small>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="show-password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Terms and Conditions -->
                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        I agree to the
                        <a href="#">
                            Terms & Conditions
                        </a>

                    </label>

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>


                <!-- Message -->
                <p
                    id="registerMessage"
                    class="form-message"
                ></p>

            </form>


            <!-- Login Link -->
            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <div class="footer-logo">
            <strong>SFS</strong>
            <span>Secure File Sharing</span>
        </div>

        <p>
            © 2026 SFS. Cloud-Based Secure File Sharing System.
        </p>

    </footer>


    <!-- Authentication JavaScript -->
    <script type="module" src="./js/auth.js"></script>

</body>

</html>
